<style>

*{

body{

header{

.header-btn{

.container{

.card{
    background:white;
    border-radius:15px;
    padding:30px;

}

.card h2{
    margin-bottom:25px;
    border-bottom:2px solid #eee;
    padding-bottom:12px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.full{
    grid-column:1/-1;
}

.field label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
    color:#374151;
}

.field input,
.field textarea{
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:8px;
    font-size:15px;
    outline:none;
}

.field input:focus,
.field textarea:focus{
    border-color:#16a34a;
}

.field textarea{
    min-height:100px;
    resize:vertical;
}

.package{
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
}

.package h3{
    margin-bottom:15px;
}

.package-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.feature{
    border:1px solid #e5e7eb;
    padding:20px;
    border-radius:12px;
    margin-bottom:15px;
}

.server{
    border:1px solid #e5e7eb;
    padding:20px;
    border-radius:12px;
    margin-bottom:15px;
}

.status{
    position:fixed;
    bottom:25px;
    right:25px;
    background:#111827;
    color:white;
    padding:15px 22px;
    border-radius:10px;
    display:none;
    z-index:999;
}

.status.success{
    background:#16a34a;
}

.status.error{
    background:#dc2626;
}

.loading{
    text-align:center;
    padding:50px;
    font-size:18px;
}

.login-screen{
    position:fixed;
    inset:0;
    background:#111827;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.login-box{
    background:white;
    width:400px;
    max-width:90%;
    padding:35px;
    border-radius:18px;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
}

.login-box h2{
    margin-bottom:10px;
}

.login-box p{
    color:#6b7280;
    margin-bottom:25px;
}

.login-box input{
    width:100%;
    padding:14px;
    border:1px solid #d1d5db;
    border-radius:8px;
    margin-bottom:15px;
}

.login-box button{
    width:100%;
    padding:14px;
    background:#16a34a;
    color:white;
    border:none;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.login-error{
    color:#dc2626;
    margin-top:12px;
    display:none;
}

@media(max-width:700px){

    .grid,
    .package-grid{
        grid-template-columns:1fr;
    }

    header{
        padding:15px;
    }

    header h1{
        font-size:18px;
    }

    .header-btn{
        padding:8px 10px;
        font-size:12px;
    }

}

</style>

</head>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbwsrBm8cD4yYOTyuJkW8YHrJj0yBnobPHOdVaE6jWn0mEi0Hh8rg8buOZBWKn-Lq362/exec";


/* CHANGE ADMIN PASSWORD HERE */

const ADMIN_PASSWORD = "123456";


let websiteData={};


function login(){

    const password=
    document.getElementById("adminPassword").value;

    if(password===ADMIN_PASSWORD){

        sessionStorage.setItem("growUpAdmin","yes");

        document.getElementById("loginScreen").style.display="none";

        loadData();

    }else{

        document.getElementById("loginError").style.display="block";

    }

}


function checkLogin(){

    if(sessionStorage.getItem("growUpAdmin")==="yes"){

        document.getElementById("loginScreen").style.display="none";

        loadData();

    }

}


function setValue(id,value){

    const el=document.getElementById(id);

    if(el){

        el.value=value ?? "";

    }

}


function loadData(){

    fetch(API_URL)

    .then(response=>response.json())

    .then(result=>{

        if(!result.success){

            showStatus("Data loading failed","error");

            return;

        }

        websiteData=result.data;

        fillEditor();

        document.getElementById("loading").style.display="none";

        document.getElementById("editor").style.display="block";

    })

    .catch(error=>{

        console.log(error);

        showStatus("Connection error","error");

    });

}


function fillEditor(){

    const d=websiteData;


    /* GENERAL */

    setValue("companyName",d.companyName);
    setValue("heroSmall",d.heroSmall);
    setValue("heroTitle",d.heroTitle);
    setValue("heroDescription",d.heroDescription);
    setValue("heroButton",d.heroButton);
    setValue("heroImage",d.heroImage);


    /* PACKAGES */

    for(let i=1;i<=4;i++){

        setValue("package"+i+"Speed",d["package"+i+"Speed"]);
        setValue("package"+i+"Price",d["package"+i+"Price"]);
        setValue("package"+i+"Item1",d["package"+i+"Item1"]);
        setValue("package"+i+"Item2",d["package"+i+"Item2"]);
        setValue("package"+i+"Item3",d["package"+i+"Item3"]);

    }


    /* FEATURES */

    for(let i=1;i<=4;i++){

        setValue("feature"+i+"Icon",d["feature"+i+"Icon"]);
        setValue("feature"+i+"Title",d["feature"+i+"Title"]);
        setValue("feature"+i+"Text",d["feature"+i+"Text"]);

    }


    /* AREAS */

    for(let i=1;i<=5;i++){

        setValue("area"+i,d["area"+i]);

    }


    /* CONTACT */

    setValue("phone",d.phone);
    setValue("email",d.email);
    setValue("address",d.address);
    setValue("footer",d.footer);


    /* SERVERS */

    createServerEditor();

}


function createServerEditor(){

    const box=document.getElementById("serverEditor");

    let html="";

    for(let i=1;i<=6;i++){

        html+=`

        <div class="server">

        <h3>Server ${i}</h3>

        <div class="package-grid">

        <div class="field">

        <label>Server Name</label>

        <input
        id="server${i}Name"
        value="${escapeHTML(websiteData["server"+i+"Name"] || "")}"
        >

        </div>

        <div class="field">

        <label>Server Link</label>

        <input
        id="server${i}Link"
        value="${escapeHTML(websiteData["server"+i+"Link"] || "")}"
        >

        </div>

        </div>

        </div>

        `;

    }

    box.innerHTML=html;

}


function escapeHTML(value){

    return String(value)
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

}


function getValue(id){

    const el=document.getElementById(id);

    return el ? el.value : "";

}


function collectData(){

    const data={};


    /* GENERAL */

    data.companyName=getValue("companyName");
    data.heroSmall=getValue("heroSmall");
    data.heroTitle=getValue("heroTitle");
    data.heroDescription=getValue("heroDescription");
    data.heroButton=getValue("heroButton");
    data.heroImage=getValue("heroImage");


    /* PACKAGES */

    for(let i=1;i<=4;i++){

        data["package"+i+"Speed"]=
        getValue("package"+i+"Speed");

        data["package"+i+"Price"]=
        getValue("package"+i+"Price");

        data["package"+i+"Item1"]=
        getValue("package"+i+"Item1");

        data["package"+i+"Item2"]=
        getValue("package"+i+"Item2");

        data["package"+i+"Item3"]=
        getValue("package"+i+"Item3");

    }


    /* FEATURES */

    for(let i=1;i<=4;i++){

        data["feature"+i+"Icon"]=
        getValue("feature"+i+"Icon");

        data["feature"+i+"Title"]=
        getValue("feature"+i+"Title");

        data["feature"+i+"Text"]=
        getValue("feature"+i+"Text");

    }


    /* SERVERS */

    for(let i=1;i<=6;i++){

        data["server"+i+"Name"]=
        getValue("server"+i+"Name");

        data["server"+i+"Link"]=
        getValue("server"+i+"Link");

    }


    /* AREAS */

    for(let i=1;i<=5;i++){

        data["area"+i]=getValue("area"+i);

    }


    /* CONTACT */

    data.phone=getValue("phone");
    data.email=getValue("email");
    data.address=getValue("address");
    data.footer=getValue("footer");


    return data;

}


function saveWebsite(){

    const data=collectData();

    const button=document.querySelector(".save-btn");

    button.disabled=true;

    button.textContent="Saving...";


    fetch(API_URL,{

        method:"POST",

        body:JSON.stringify({

            action:"save",
            data:data

        })

    })

    .then(response=>response.json())

    .then(result=>{

        if(result.success){

            showStatus(
            "✓ Website saved successfully!",
            "success"
            );

        }else{

            showStatus(
            result.message || "Save failed",
            "error"
            );

        }

    })

    .catch(error=>{

        console.log(error);

        showStatus(
        "Save connection error",
        "error"
        );

    })

    .finally(()=>{

        button.disabled=false;

        button.textContent="💾 SAVE";

    });

}


function showStatus(message,type){

    const status=document.getElementById("status");

    status.textContent=message;

    status.className="status "+type;

    status.style.display="block";

    setTimeout(()=>{

        status.style.display="none";

    },3000);

}


document
.getElementById("adminPassword")
.addEventListener("keydown",function(e){

    if(e.key==="Enter"){

        login();

    }

});


checkLogin();

</script>
